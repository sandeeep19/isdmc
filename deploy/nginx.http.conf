# Phase 1: plain HTTP. Serves the app and the ACME challenge so certbot can
# issue the first certificate. Replaced by nginx.ssl.conf once that succeeds.
upstream backend  { server backend:8000; }
upstream frontend { server frontend:3000; }

server {
    listen 80;
    server_name indianstudiodmc.com www.indianstudiodmc.com _;

    client_max_body_size 25M;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /media/ {
        alias /srv/media/;
        expires 30d;
    }

    location ~ ^/(api|admin|static)(/|$) {
        proxy_pass http://backend;
        include /etc/nginx/proxy_common.conf;
    }

    location / {
        proxy_pass http://frontend;
        include /etc/nginx/proxy_common.conf;
    }
}
