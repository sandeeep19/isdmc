# Phase 2: TLS terminated here. Mirrors the ALB's old rules -- /api, /admin and
# /static to Django, everything else to Next.js.
upstream backend  { server backend:8000; }
upstream frontend { server frontend:3000; }

server {
    listen 80;
    server_name indianstudiodmc.com www.indianstudiodmc.com;

    # Left open so certbot can renew without downtime.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Apex -> www, so there is a single canonical host.
server {
    listen 443 ssl;
    http2 on;
    server_name indianstudiodmc.com;

    ssl_certificate     /etc/letsencrypt/live/indianstudiodmc.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/indianstudiodmc.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    return 301 https://www.indianstudiodmc.com$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name www.indianstudiodmc.com;

    ssl_certificate     /etc/letsencrypt/live/indianstudiodmc.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/indianstudiodmc.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 25M;

    location /media/ {
        alias /srv/media/;
        expires 30d;
    }

    location ~ ^/(api|admin|static)(/|$) {
        proxy_pass http://backend;
        include /etc/nginx/proxy_common.conf;
    }

    location / {
        proxy_pass http://frontend;
        include /etc/nginx/proxy_common.conf;
    }
}
