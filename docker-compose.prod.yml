services:
  backend:
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env.production
    volumes:
      # sqlite and uploads must outlive the container.
      - ./backend/db.sqlite3:/app/db.sqlite3
      - media:/app/media
    expose:
      - "8000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    expose:
      - "3000"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/active.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/proxy_common.conf:/etc/nginx/proxy_common.conf:ro
      - media:/srv/media:ro
      - certbot-conf:/etc/letsencrypt:ro
      - certbot-web:/var/www/certbot

  certbot:
    image: certbot/certbot:latest
    volumes:
      - certbot-conf:/etc/letsencrypt
      - certbot-web:/var/www/certbot
    # Renewal is driven by the host cron; see deploy/README.md.
    entrypoint: ["/bin/sh", "-c", "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"]

volumes:
  media:
  certbot-conf:
  certbot-web:
